const topicsFor = type => (DB.topics[type] || []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
const enabledMenus = () => DB.menus.filter(m=>m.enabled).sort((a,b)=>(a.order||0)-(b.order||0));
const menuById = id => DB.menus.find(m=>m.id===id);
const findTopic = (type,id) => topicsFor(type).find(t=>t.id===id);

function applyBranding(){
  const s = DB.site;
  $('#brandName').textContent = s.owner || 'Knowledge Hub';
  $('#brandSub').textContent  = s.tagline || '';
  $('#brandMark').textContent = s.brandInitial || (s.owner||'K').trim().charAt(0).toUpperCase();
  document.title = s.title || 'Knowledge Hub';
}

function renderNav(){
  const nav = $('#nav');
  nav.innerHTML = '';
  enabledMenus().forEach(m=>{
    const b = document.createElement('button');
    b.className = 'nav-item' + (current.menuId===m.id?' active':'');
    b.innerHTML = (I[m.icon]||I.page) + '<span>'+esc(m.label)+'</span>';
    b.addEventListener('click', ()=>{ selectMenu(m.id); closeMobileNav(); });
    nav.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'nav-item admin-only';
  add.style.color = 'var(--accent-strong)';
  add.innerHTML = I.plus + '<span>Menu</span>';
  add.addEventListener('click', ()=> openMenuManager());
  nav.appendChild(add);
}

function selectMenu(menuId){
  const m = menuById(menuId);
  if(!m) return;
  current.menuId = menuId;
  current.type = m.type;
  current.topicId = null;
  current.subId = null;
  current.openId = null;
  expanded = {};
  if(m.type !== 'resume'){
    const tops = topicsFor(m.type);
    if(tops.length){ current.topicId = tops[0].id; if(tops[0].subtopics&&tops[0].subtopics.length) expanded[tops[0].id]=true; }
  }
  renderNav();
  renderSidebar();
  renderContent();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderSidebar(){
  const side = $('#sidebar');
  const shell = $('#shell');
  if(current.type === 'resume' || !current.type){
    side.hidden = true;
    shell.classList.remove('with-sidebar');
    shell.classList.add('full');
    return;
  }
  side.hidden = false;
  shell.classList.add('with-sidebar');
  shell.classList.remove('full');

  const m = menuById(current.menuId);
  const tops = topicsFor(current.type);
  const items = itemsFor(current.type);
  const q = (side.dataset.q || '').toLowerCase();

  const countTopic = t => items.filter(i=>i.topicId===t.id).length;
  const countSub   = (t,s) => items.filter(i=>i.topicId===t.id && i.subId===s.id).length;

  let html = '<div class="sidebar-head"><h3>'+esc(m.label)+'</h3></div>';
  html += '<div class="search-box">'+I.search+'<input type="text" id="treeSearch" placeholder="Filter topics…" value="'+esc(side.dataset.q||'')+'"></div>';
  html += '<ul class="tree">';

  tops.forEach(t=>{
    const subs = (t.subtopics||[]);
    const matchTopic = !q || t.label.toLowerCase().includes(q);
    const matchSubs = subs.filter(s=> !q || s.label.toLowerCase().includes(q));
    if(q && !matchTopic && matchSubs.length===0) return;
    const isOpen = expanded[t.id] || (q && matchSubs.length>0);
    const activeTopic = current.topicId===t.id && !current.subId;
    html += '<li class="tree-topic">';
    html += '<div class="topic-row'+(activeTopic?' active':'')+(isOpen?' open':'')+'" data-topic="'+t.id+'">';
    html += subs.length ? '<span class="topic-caret">'+I.caret+'</span>' : '<span class="topic-spacer"></span>';
    html += '<span class="te-emoji" style="width:auto">'+esc(t.emoji||'')+'</span>';
    html += '<span class="topic-label">'+esc(t.label)+'</span>';
    html += '<span class="topic-count">'+countTopic(t)+'</span>';
    html += '</div>';
    if(subs.length){
      html += '<ul class="subtree"'+(isOpen?'':' style="display:none"')+'>';
      (q?matchSubs:subs).forEach(s=>{
        const activeSub = current.subId===s.id;
        html += '<div class="sub-row'+(activeSub?' active':'')+'" data-topic="'+t.id+'" data-sub="'+s.id+'">';
        html += '<span class="topic-label">'+esc(s.label)+'</span>';
        html += '<span class="topic-count">'+countSub(t,s)+'</span>';
        html += '</div>';
      });
      html += '</ul>';
    }
    html += '</li>';
  });
  html += '</ul>';
  html += '<button class="section-add" id="manageTopicsBtn" style="margin-top:1.2rem">'+I.edit+' Manage topics</button>';
  side.innerHTML = html;

  side.querySelectorAll('.topic-row').forEach(row=>{
    row.addEventListener('click', ()=>{
      const id = row.dataset.topic;
      const t = findTopic(current.type, id);
      const hasSubs = t.subtopics && t.subtopics.length;
      if(current.topicId===id && !current.subId && expanded[id]){ expanded[id]=false; }
      else { if(hasSubs) expanded[id]=true; current.topicId=id; current.subId=null; current.openId=null; }
      renderSidebar(); renderContent();
    });
  });
  side.querySelectorAll('.sub-row').forEach(row=>{
    row.addEventListener('click', e=>{
      e.stopPropagation();
      current.topicId = row.dataset.topic;
      current.subId = row.dataset.sub;
      current.openId = null;
      expanded[current.topicId] = true;
      renderSidebar(); renderContent();
      closeMobileSidebar();
    });
  });
  const search = $('#treeSearch');
  if(search){
    search.addEventListener('input', ()=>{ side.dataset.q = search.value; const pos=search.selectionStart; renderSidebar(); const s2=$('#treeSearch'); if(s2){ s2.focus(); try{s2.setSelectionRange(pos,pos);}catch(_){}}});
  }
  const mt = $('#manageTopicsBtn');
  if(mt) mt.addEventListener('click', ()=> openTopicManager(current.type));
}

/* =====================================================================
   6. CONTENT RENDERERS
   ===================================================================== */
const cap = s => { s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); };
function excerpt(src, n=120){
  let s = String(src||'')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/[#>*_`~|]+/g,' ')
    .replace(/\s+/g,' ').trim();
  return s.length>n ? s.slice(0,n).trim()+'…' : s;
}
function emptyState(title, sub){
  return '<div class="empty">'+I.folder+'<h3>'+esc(title)+'</h3><p>'+esc(sub)+'</p></div>';
}
function addBtn(label, kind){
  return '<button class="section-add" data-add="'+kind+'">'+I.plus+' '+esc(label)+'</button>';
}
function breadcrumbHTML(topicLabel, subLabel){
  let b = '<div class="breadcrumb"><a href="#" data-home>'+esc((menuById(current.menuId)||{}).label||'Home')+'</a>';
  b += '<span class="sep">/</span><span>'+esc(topicLabel)+'</span>';
  if(subLabel) b += '<span class="sep">/</span><span>'+esc(subLabel)+'</span>';
  return b + '</div>';
}
function curTopicSub(type){
  const t = findTopic(type, current.topicId);
  const subLabel = (t && current.subId) ? ((t.subtopics||[]).find(s=>s.id===current.subId)||{}).label : null;
  return { t, subLabel };
}
function filterItems(type){
  const items = itemsFor(type);
  return items.filter(i => current.subId ? (i.topicId===current.topicId && i.subId===current.subId) : i.topicId===current.topicId);
}

function renderContent(){
  const c = $('#content');
  c.classList.remove('view-enter'); void c.offsetWidth; c.classList.add('view-enter');
  const type = current.type;
  if(type==='interview')      c.innerHTML = renderInterview();
  else if(type==='blogs')     c.innerHTML = current.openId ? renderArticle() : renderBlogList();
  else if(type==='notes')     c.innerHTML = current.openId ? renderNoteDoc() : renderNoteList();
  else if(type==='resume')    c.innerHTML = renderResume();
  else                        c.innerHTML = emptyState('Nothing selected','Pick a menu above.');
  wireContent();
}

/* ---------- INTERVIEW ---------- */
function renderInterview(){
  const {t, subLabel} = curTopicSub('interview');
  if(!t) return emptyState('No topics yet','Add a topic from “Manage topics”.');
  const items = filterItems('interview');
  let head = '<div class="view-head">'+breadcrumbHTML(t.label, subLabel)+
    '<div class="eyebrow">'+I.question+' Interview Questions</div>'+
    '<h1 class="view-title">'+esc(subLabel||t.label)+'</h1>'+
    '<p class="view-lead">'+items.length+' question'+(items.length===1?'':'s')+' to sharpen your '+esc(subLabel||t.label)+' interviews.</p></div>';
  if(!items.length) return head + emptyState('No questions here yet', isAdmin?'Use “Add question” below to create the first one.':'Check back soon.') + addBtn('Add question','q');
  let list = '<div class="qa-list stagger">';
  items.forEach((it,idx)=>{
    list += '<div class="qa" data-id="'+it.id+'">';
    list += '<button class="qa-q" data-toggle><span class="qa-num">'+String(idx+1).padStart(2,'0')+'</span><span class="qa-q-text">'+esc(it.q)+'</span><span class="qa-toggle">'+I.plus+'</span></button>';
    list += '<div class="qa-body"><div class="qa-body-inner rich">'+md(it.a)+'</div>';
    let meta = '<div class="qa-meta"><span class="pill-diff diff-'+(it.difficulty||'medium')+'">'+cap(it.difficulty||'medium')+'</span>';
    (it.tags||[]).forEach(tg=> meta += '<span class="chip muted">'+esc(tg)+'</span>');
    meta += '</div>';
    list += meta;
    list += '<div class="qa-admin-row admin-only"><button class="btn btn-sm btn-outline" data-edit="q" data-id="'+it.id+'">'+I.edit+' Edit</button><button class="btn btn-sm btn-danger" data-del="q" data-id="'+it.id+'">'+I.trash+' Delete</button></div>';
    list += '</div></div>';
  });
  list += '</div>';
  return head + list + addBtn('Add question','q');
}

/* ---------- BLOGS ---------- */
function renderBlogList(){
  const {t, subLabel} = curTopicSub('blogs');
  if(!t) return emptyState('No topics yet','Add a topic from “Manage topics”.');
  const items = filterItems('blogs').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let head = '<div class="view-head">'+breadcrumbHTML(t.label, subLabel)+
    '<div class="eyebrow">'+I.blog+' Blog</div>'+
    '<h1 class="view-title">'+esc(subLabel||t.label)+'</h1>'+
    '<p class="view-lead">Field notes, deep dives and lessons on '+esc(subLabel||t.label)+'.</p></div>';
  if(!items.length) return head + emptyState('No posts yet', isAdmin?'Write your first post with “Add blog post”.':'Check back soon.') + addBtn('Add blog post','blog');
  let grid = '<div class="blog-grid stagger">';
  items.forEach(b=>{
    const cover = b.cover
      ? '<img src="'+esc(b.cover)+'" alt="">'
      : '<div class="blog-cover-fallback" style="background:'+gradFor(b.id+b.title)+'">'+esc((b.title||'•').trim().charAt(0))+'</div>';
    grid += '<article class="blog-card" data-open="'+b.id+'">';
    grid += '<div class="blog-cover">'+cover+'</div>';
    grid += '<div class="blog-card-body">';
    grid += '<div class="blog-card-meta">'+(b.tags&&b.tags[0]?'<span>'+esc(b.tags[0])+'</span><span class="dot"></span>':'')+'<span>'+fmtDate(b.date)+'</span>'+(b.read?'<span class="dot"></span><span>'+esc(b.read)+' min read</span>':'')+'</div>';
    grid += '<h3>'+esc(b.title)+'</h3>';
    grid += '<p class="blog-excerpt">'+esc(b.subtitle||excerpt(b.body))+'</p>';
    grid += '</div></article>';
  });
  grid += '</div>';
  return head + grid + addBtn('Add blog post','blog');
}
function renderArticle(){
  const b = itemsFor('blogs').find(x=>x.id===current.openId);
  if(!b){ current.openId=null; return renderBlogList(); }
  let h = '<div class="article">';
  h += '<a href="#" class="btn btn-ghost btn-sm" data-back style="margin-bottom:1.2rem">‹ Back to posts</a>';
  h += '<div class="article-hero"><div class="tags">';
  (b.tags||[]).forEach(tg=> h += '<span class="chip">'+esc(tg)+'</span>');
  h += '</div><h1>'+esc(b.title)+'</h1>';
  if(b.subtitle) h += '<p class="article-sub">'+esc(b.subtitle)+'</p>';
  h += '<div class="article-byline"><span class="byline-avatar">'+esc((b.author||'K').trim().charAt(0))+'</span><span>'+esc(b.author||'')+'</span>';
  h += '<span>·</span><span>'+fmtDate(b.date)+'</span>'+(b.read?'<span>·</span><span>'+esc(b.read)+' min read</span>':'');
  h += '<span class="edit-affordance" style="margin-left:auto"><button class="btn btn-sm btn-outline" data-edit="blog" data-id="'+b.id+'">'+I.edit+' Edit</button><button class="btn btn-sm btn-danger" data-del="blog" data-id="'+b.id+'">'+I.trash+'</button></span>';
  h += '</div></div>';
  if(b.cover) h += '<img class="article-cover" src="'+esc(b.cover)+'" alt="">';
  h += '<div class="rich">'+md(b.body)+'</div></div>';
  return h;
}

/* ---------- NOTES ---------- */
function renderNoteList(){
  const {t, subLabel} = curTopicSub('notes');
  if(!t) return emptyState('No topics yet','Add a topic from “Manage topics”.');
  const items = filterItems('notes').sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));
  let head = '<div class="view-head">'+breadcrumbHTML(t.label, subLabel)+
    '<div class="eyebrow">'+I.note+' Notes</div>'+
    '<h1 class="view-title">'+esc(subLabel||t.label)+'</h1>'+
    '<p class="view-lead">A Confluence-style space for '+esc(subLabel||t.label)+' references and runbooks.</p></div>';
  if(!items.length) return head + emptyState('No notes yet', isAdmin?'Create your first note with “Add note”.':'Check back soon.') + addBtn('Add note','note');
  const accents = ['var(--primary)','var(--accent)','var(--blue)','var(--rose)','var(--gold)'];
  let grid = '<div class="note-grid stagger">';
  items.forEach((n,idx)=>{
    grid += '<article class="note-card" data-open="'+n.id+'" style="--note-accent:'+accents[hashStr(n.id)%accents.length]+'">';
    grid += '<div class="note-ico">'+esc(n.emoji||'📄')+'</div><h3>'+esc(n.title)+'</h3>';
    grid += '<p>'+esc(excerpt(n.body))+'</p>';
    grid += '<div class="blog-card-meta"><span>Updated '+fmtDate(n.updated)+'</span></div></article>';
  });
  grid += '</div>';
  return head + grid + addBtn('Add note','note');
}
function renderNoteDoc(){
  const n = itemsFor('notes').find(x=>x.id===current.openId);
  if(!n){ current.openId=null; return renderNoteList(); }
  const banner = n.banner==='alt'?' alt':n.banner==='alt2'?' alt2':'';
  let h = '<a href="#" class="btn btn-ghost btn-sm" data-back style="margin-bottom:1.2rem">‹ Back to notes</a>';
  h += '<div class="note-doc"><div class="note-doc-banner'+banner+'"><div class="emoji">'+esc(n.emoji||'📄')+'</div></div>';
  h += '<div class="note-doc-body"><h1>'+esc(n.title)+'</h1>';
  h += '<div class="note-doc-meta"><span>Updated '+fmtDate(n.updated)+'</span>';
  h += '<span class="edit-affordance" style="margin-left:auto"><button class="btn btn-sm btn-outline" data-edit="note" data-id="'+n.id+'">'+I.edit+' Edit</button><button class="btn btn-sm btn-danger" data-del="note" data-id="'+n.id+'">'+I.trash+'</button></span></div>';
  h += '<div class="rich">'+md(n.body)+'</div></div></div>';
  return h;
}

/* ---------- RESUME ---------- */
function renderResume(){
  const r = DB.resume || {};
  const c = r.contact || {};
  const url = u => /^https?:\/\//i.test(u) ? u : 'https://'+u;
  let contact = '';
  if(c.phone)     contact += '<a href="tel:'+esc(c.phone.replace(/\s/g,''))+'">'+I.phone+esc(c.phone)+'</a>';
  if(c.email)     contact += '<a href="mailto:'+esc(c.email)+'">'+I.mail+esc(c.email)+'</a>';
  if(c.location)  contact += '<span style="display:inline-flex;align-items:center;gap:.4rem">'+I.pin+esc(c.location)+'</span>';
  if(c.linkedin)  contact += '<a href="'+esc(url(c.linkedin))+'" target="_blank" rel="noopener">'+I.link+'LinkedIn</a>';
  if(c.trailhead) contact += '<a href="'+esc(url(c.trailhead))+'" target="_blank" rel="noopener">'+I.award+'Trailhead</a>';

  let stats = '';
  (r.stats||[]).forEach(s=> stats += '<div class="resume-stat"><div class="n">'+esc(s.n)+'</div><div class="l">'+esc(s.l)+'</div></div>');

  let why = '';
  (r.why||[]).forEach(w=> why += '<div class="why-item"><span class="chk">'+I.check+'</span><div><h4>'+esc(w.h)+'</h4><p>'+esc(w.p)+'</p></div></div>');

  let exp = '';
  (r.experience||[]).forEach(e=>{
    exp += '<div class="exp"><div class="exp-head"><div><div class="exp-role">'+esc(e.role)+'</div><div class="exp-co">'+esc(e.company)+'</div></div><div class="exp-date">'+esc(e.date)+'</div></div>';
    if(e.location) exp += '<div class="exp-loc">'+esc(e.location)+'</div>';
    if(e.bullets&&e.bullets.length){ exp += '<ul>'; e.bullets.forEach(b=> exp += '<li>'+esc(b)+'</li>'); exp += '</ul>'; }
    exp += '</div>';
  });

  let skills = '';
  (r.skills||[]).forEach(cl=>{
    skills += '<div class="skill-cluster"><div class="scat">'+esc(cl.cat)+'</div><div class="skill-tags">';
    (cl.tags||[]).forEach(tg=> skills += '<span class="skill-tag">'+esc(tg)+'</span>');
    skills += '</div></div>';
  });

  let certs = '';
  (r.certs||[]).forEach(ct=> certs += '<div class="cert-card'+(ct.progress?' progress':'')+'"><span class="badge">'+I.award+'</span><div><h4>'+esc(ct.title)+'</h4><p>'+esc(ct.sub)+'</p></div></div>');

  let edu = '';
  (r.education||[]).forEach(ed=> edu += '<div class="cert-card"><span class="badge">'+I.cap+'</span><div><h4>'+esc(ed.title)+'</h4><p>'+esc(ed.sub)+'</p></div></div>');

  let ach = '';
  (r.achievements||[]).forEach(a=> ach += '<div class="ach-item"><span class="star">'+I.star+'</span><span><b>'+esc(a.title)+'</b> — '+esc(a.text)+'</span></div>');

  const sectionHead = (icon,title) => '<div class="resume-section-head"><span class="ico">'+icon+'</span><h2>'+esc(title)+'</h2></div>';

  let h = '<div class="resume-wrap">';
  h += '<div class="resume-toolbar"><div class="tlabel">'+I.resume+' '+esc(r.name||'Resume')+(r.available?' · <span style="color:var(--ok)">Open to opportunities</span>':'')+'</div>';
  h += '<div class="tactions">';
  h += '<button class="btn btn-sm btn-outline edit-affordance" data-edit="resume">'+I.edit+' Edit</button>';
  h += '<button class="btn btn-sm btn-outline" id="printResume">'+I.print+' Print</button>';
  h += '<button class="btn btn-sm btn-primary" id="exportResume">'+I.download+' Export PDF</button>';
  h += '</div></div>';

  h += '<div class="resume" id="resumeRoot">';
  h += '<div class="resume-hero"><div class="resume-hero-inner">';
  h += '<div class="resume-avatar">'+esc(r.avatar||(r.name||'K').trim().charAt(0))+'</div>';
  h += '<div style="flex:1;min-width:240px"><h1>'+esc(r.name||'')+'</h1><div class="resume-role">'+esc(r.role||'')+'</div>';
  h += '<div class="resume-contact">'+contact+'</div></div></div>';
  if(stats) h += '<div class="resume-stats">'+stats+'</div>';
  h += '</div>';

  h += '<div class="resume-body">';
  if(r.summary){ h += '<div class="resume-section">'+sectionHead(I.spark,'Profile')+'<p class="resume-summary">'+esc(r.summary)+'</p></div>'; }
  if(why){ h += '<div class="why-band"><h2>'+I.star+' Why hire me</h2><div class="why-grid">'+why+'</div></div>'; }
  if(exp){ h += '<div class="resume-section">'+sectionHead(I.briefcase,'Experience')+'<div class="timeline">'+exp+'</div></div>'; }
  if(skills){ h += '<div class="resume-section">'+sectionHead(I.layers,'Skills & Technologies')+skills+'</div>'; }
  if(certs){ h += '<div class="resume-section">'+sectionHead(I.award,'Certifications')+'<div class="cert-grid">'+certs+'</div></div>'; }
  if(edu){ h += '<div class="resume-section">'+sectionHead(I.cap,'Education')+'<div class="edu-grid">'+edu+'</div></div>'; }
  if(ach){ h += '<div class="resume-section">'+sectionHead(I.star,'Key Achievements')+'<div class="ach-list">'+ach+'</div></div>'; }
  h += '</div></div></div>';
  return h;
}

function exportResumePDF(){
  const node = $('#resumeRoot');
  if(!node || typeof html2pdf==='undefined'){ window.print(); return; }
  const name = (DB.resume.exportName || (DB.resume.name||'resume').replace(/\s+/g,'_')) + '.pdf';
  node.classList.add('pdf-mode');
  toast('Generating PDF…','ok');
  const opt = {
    margin:[8,8,8,8],
    filename:name,
    image:{type:'jpeg',quality:0.98},
    html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff', scrollY:0},
    jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
    pagebreak:{mode:['css','legacy']}
  };
  html2pdf().set(opt).from(node).save().then(()=>{
    node.classList.remove('pdf-mode');
  }).catch(()=>{ node.classList.remove('pdf-mode'); toast('Export failed — try Print','err'); });
}

/* =====================================================================
   7. WIRING (content listeners) + AUTH + MODAL CORE
   ===================================================================== */
function wireContent(){
  const c = $('#content');
  c.querySelectorAll('[data-toggle]').forEach(btn=>{
    btn.addEventListener('click', ()=> btn.closest('.qa').classList.toggle('open'));
  });
  c.querySelectorAll('[data-open]').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('button')) return;
      current.openId = card.dataset.open;
      renderContent(); window.scrollTo({top:0,behavior:'smooth'});
    });
  });
  c.querySelectorAll('[data-back]').forEach(a=> a.addEventListener('click', e=>{ e.preventDefault(); current.openId=null; renderContent(); window.scrollTo({top:0,behavior:'smooth'}); }));
  c.querySelectorAll('[data-home]').forEach(a=> a.addEventListener('click', e=>{ e.preventDefault(); current.openId=null; const tops=topicsFor(current.type); if(tops[0]){current.topicId=tops[0].id;current.subId=null;} renderSidebar(); renderContent(); }));
  c.querySelectorAll('[data-add]').forEach(b=> b.addEventListener('click', ()=> onAdd(b.dataset.add)));
  c.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', e=>{ e.stopPropagation(); onEdit(b.dataset.edit, b.dataset.id); }));
  c.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', e=>{ e.stopPropagation(); onDelete(b.dataset.del, b.dataset.id); }));
  const ex=$('#exportResume'); if(ex) ex.addEventListener('click', exportResumePDF);
  const pr=$('#printResume'); if(pr) pr.addEventListener('click', ()=>window.print());
}

    '<button type="button" data-md="quote" title="Callout / quote">&ldquo;</button>'+

    '<button type="button" data-md="table" title="Table">▦</button>'+
  '</div>';
  return '<div class="editor-split"><div>'+tb+
    '<div class="editor-wrap"><textarea id="'+id+'" class="code" placeholder="Write in Markdown…">'+esc(value||'')+'</textarea></div></div>'+
    '<div class="editor-preview"><div class="editor-preview-label">Live preview</div><div class="rich" id="'+id+'-prev"></div></div></div>';

function wireEditor(id){
  const ta=$('#'+id), prev=$('#'+id+'-prev'), tb=document.querySelector('.editor-toolbar[data-for="'+id+'"]');
  const upd=()=>{ prev.innerHTML = md(ta.value) || '<p style="color:var(--ink-faint)">Nothing yet…</p>'; };
  ta.addEventListener('input', upd); upd();
  if(tb) tb.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>{ applyMd(ta, b.dataset.md); upd(); }));
}
function applyMd(ta, kind){
  const s=ta.selectionStart, e=ta.selectionEnd, val=ta.value, sel=val.slice(s,e);
  const set=(text, caret)=>{ ta.value=text; ta.focus(); if(caret!=null){ ta.selectionStart=ta.selectionEnd=caret; } };
  const wrap=(pre,post)=>{ set(val.slice(0,s)+pre+sel+post+val.slice(e)); ta.selectionStart=s+pre.length; ta.selectionEnd=s+pre.length+sel.length; };
  const line=(p)=>{ set(val.slice(0,s)+p+sel+val.slice(e), s+p.length+sel.length); };
  const cb='```';
  switch(kind){
    case 'h2': line('## '); break;
    case 'h3': line('### '); break;
    case 'b': wrap('**','**'); break;
    case 'i': wrap('*','*'); break;
    case 'inline': wrap('`','`'); break;
    case 'ul': line('- '); break;
    case 'ol': line('1. '); break;
    case 'quote': line('> '); break;
    case 'code': wrap('\n'+cb+'apex\n','\n'+cb+'\n'); break;
    case 'link': wrap('[', '](https://)'); break;
    case 'table': set(val.slice(0,s)+'\n| Column | Column |\n|---|---|\n| Cell | Cell |\n'+val.slice(e)); break;
  }
}

function wireTags(id){
  const box=$('#'+id), inp=box.querySelector('input');
  box.addEventListener('click', e=>{ const rm=e.target.closest('[data-rmtag]'); if(rm){ rm.closest('.tag-pill').remove(); } else inp.focus(); });
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===','){ e.preventDefault(); const v=inp.value.trim().replace(/,+$/,''); if(v){ inp.insertAdjacentHTML('beforebegin', tagPill(v)); inp.value=''; } }
    else if(e.key==='Backspace' && !inp.value){ const p=box.querySelectorAll('.tag-pill'); if(p.length) p[p.length-1].remove(); }
  });
}

/* dropzone + extraction */
function dropzoneHTML(id){
  return '<div class="dz" id="'+id+'">'+I.upload+
    '<p class="big">Drop a PDF or DOCX, or click to browse</p>'+
    '<p>Text is extracted in your browser and dropped into the editor — nothing is uploaded.</p>'+
    '<div class="dz-status" id="'+id+'-status"></div>'+
    '<input type="file" id="'+id+'-file" accept=".pdf,.docx" hidden></div>';
}
function wireDropzone(id, onText){
  const dz=$('#'+id), file=$('#'+id+'-file'), status=$('#'+id+'-status');
  dz.addEventListener('click', e=>{ if(e.target!==file) file.click(); });
  ['dragover','dragenter'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev=> dz.addEventListener(ev, e=>{ e.preventDefault(); dz.classList.remove('drag'); }));
  dz.addEventListener('drop', e=>{ const f=e.dataTransfer.files[0]; if(f) go(f); });
  file.addEventListener('change', ()=>{ if(file.files[0]) go(file.files[0]); });
  async function go(f){
    status.textContent='Reading '+f.name+'…'; status.style.color='var(--ink-soft)';
    try{
      let text='';
      if(/\.pdf$/i.test(f.name)) text=await extractPdf(f);
      else if(/\.docx$/i.test(f.name)) text=await extractDocx(f);
      else { status.textContent='Unsupported file — use PDF or DOCX.'; status.style.color='var(--danger)'; return; }
      status.textContent='✓ Extracted '+text.length.toLocaleString()+' characters'; status.style.color='var(--ok)';
      onText(text, f);
    }catch(err){ console.error(err); status.textContent='Could not read that file.'; status.style.color='var(--danger)'; }
  }
}
async function extractPdf(file){
  if(typeof pdfjsLib==='undefined') throw new Error('pdf.js missing');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    out.push(tc.items.map(it=>it.str).join(' '));
  }
  return out.join('\n\n').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}
async function extractDocx(file){
  if(typeof mammoth==='undefined') throw new Error('mammoth missing');
  const buf=await file.arrayBuffer();
  const res=await mammoth.extractRawText({arrayBuffer:buf});
  return (res.value||'').trim();
}

/* generic field / card repeater (used by the resume editor) */
function fieldHTML(f, item){
  let val='';
  if(item){
    if(f.type==='list') val=(item[f.k]||[]).join(', ');
    else if(f.type==='lines') val=(item[f.k]||[]).join('\n');
    else val=(item[f.k]==null?'':item[f.k]);
  }
  let inner;
  if(f.type==='textarea') inner='<textarea data-k="'+f.k+'">'+esc(val)+'</textarea>';
  else if(f.type==='lines') inner='<textarea data-k="'+f.k+'" data-lines="1" style="min-height:96px">'+esc(val)+'</textarea>';
  else if(f.type==='list') inner='<textarea data-k="'+f.k+'" data-list="1" style="min-height:54px">'+esc(val)+'</textarea>';
  else if(f.type==='select') inner='<select data-k="'+f.k+'">'+f.options.map(o=>'<option value="'+o[0]+'"'+(String(item?(item[f.k]?'1':''):f.def||'')===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>';
  else inner='<input type="text" data-k="'+f.k+'" value="'+esc(val)+'">';
  return '<div class="mgr-field"'+(f.span?' style="grid-column:1/-1"':'')+'><label>'+esc(f.label)+'</label>'+inner+'</div>';
}
function cardHTML(fields, item, cols){
  return '<div class="mgr-card"><button type="button" class="icon-btn mgr-del" data-delcard title="Remove">'+I.trash+'</button>'+
    '<div class="mgr-grid" style="grid-template-columns:repeat('+(cols||2)+',minmax(0,1fr))">'+
    fields.map(f=>fieldHTML(f,item)).join('')+'</div></div>';
}
function collectCard(card, fields){
  const o={};
  fields.forEach(f=>{
    const el=card.querySelector('[data-k="'+f.k+'"]'); if(!el) return;
    const v=el.value;
    if(f.type==='list') o[f.k]=v.split(',').map(x=>x.trim()).filter(Boolean);
    else if(f.type==='lines') o[f.k]=v.split('\n').map(x=>x.trim()).filter(Boolean);
    else if(f.type==='select' && f.bool) o[f.k]=(v==='1');
    else o[f.k]=v.trim();
  });
  return o;
}
function sectionHTML(secId, title, fields, items, cols){
  return '<div class="mgr-sec-title">'+esc(title)+
    '<button type="button" class="btn btn-sm btn-ghost mgr-add" data-add-card="'+secId+'">'+I.plus+' Add</button></div>'+
    '<div class="mgr-rows" id="'+secId+'">'+(items||[]).map(it=>cardHTML(fields,it,cols)).join('')+'</div>';
}
function wireSection(secId, fields, cols){
  const box=$('#'+secId);
  const addBtnEl=document.querySelector('[data-add-card="'+secId+'"]');
  if(addBtnEl) addBtnEl.addEventListener('click', ()=>{ box.insertAdjacentHTML('beforeend', cardHTML(fields,null,cols)); box.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'}); });
  box.addEventListener('click', e=>{ const d=e.target.closest('[data-delcard]'); if(d) d.closest('.mgr-card').remove(); });
}
function collectSection(secId, fields){
  return Array.from($('#'+secId).querySelectorAll('.mgr-card')).map(c=>collectCard(c,fields));
}

      '<div class="ord-btns"><button type="button" data-up title="Move up">&#9650;</button><button type="button" data-down title="Move down">&#9660;</button></div>'+
      '<button type="button" class="icon-btn te-mini" data-delmenu title="Delete menu" style="margin-bottom:1px">'+I.trash+'</button>'+
    '</div>';
  }
  const body=
    '<div class="mgr-note">Menus appear in the top navigation in the order shown below. Each menu points at one section type — Interview Q&amp;A, Blogs and Notes each get their own topic tree; Resume shows your “Why hire me” page. Re-order with the arrows, hide a menu without deleting its content, or add as many as you like.</div>'+

    '<button type="button" class="section-add" id="addMenuRow" style="display:flex">'+I.plus+' Add a menu</button>';
  openModal(modalShell('Manage menus','Navigation', body,
    '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="menuSave">'+I.check+' Save menus</button>'), {wide:true});

  const list=$('#menuList');
  function freshRow(){ return menuRow({ id:uid('m'), label:'New menu', type:'blogs', icon:'page', enabled:true }); }
  function syncIcon(row){ const sel=row.querySelector('[data-k="icon"]'); const ic=row.querySelector('[data-ic]'); if(sel&&ic) ic.innerHTML=I[sel.value]||I.page; }
  list.addEventListener('change', e=>{ if(e.target.matches('[data-k="icon"]')) syncIcon(e.target.closest('.menu-row')); });
  list.addEventListener('click', e=>{
    const row=e.target.closest('.menu-row'); if(!row) return;
    if(e.target.closest('[data-up]') && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
    else if(e.target.closest('[data-down]') && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
    else if(e.target.closest('[data-delmenu]')){ if(list.querySelectorAll('.menu-row').length<=1){ toast('Keep at least one menu','err'); return; } row.remove(); }
  });
  $('#addMenuRow').addEventListener('click', ()=>{ list.insertAdjacentHTML('beforeend', freshRow()); list.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'}); });

  $('#menuSave').addEventListener('click', ()=>{
    const rows=Array.from(list.querySelectorAll('.menu-row'));
    const next=[];
    let bad=false;
    rows.forEach((row,i)=>{
      const label=row.querySelector('[data-k="label"]').value.trim();
      if(!label) bad=true;
      next.push({ id:row.dataset.id, label:label||'Untitled', type:row.querySelector('[data-k="type"]').value, icon:row.querySelector('[data-k="icon"]').value, enabled:row.querySelector('[data-k="enabled"]').value==='1', order:i });
    });
    if(bad) return toast('Every menu needs a label','err');
    if(!next.some(m=>m.enabled)) return toast('At least one menu must be visible','err');
    DB.menus=next; save(); closeModal(); toast('Menus updated','ok');
    if(!menuById(current.menuId) || !menuById(current.menuId).enabled){ selectMenu(enabledMenus()[0].id); }
    else { renderNav(); }
  });
}

const TYPE_PREFIX = { interview:'int', blogs:'blog', notes:'note' };
function openTopicManager(type){
  ensureMgrStyles();
  const prefix = TYPE_PREFIX[type] || 'top';
  const tops = topicsFor(type);
  const m = menuById(current.menuId);

  function subRow(s){
    return '<div class="te-sub" data-sub-id="'+esc(s?s.id:'')+'">'+
      '<span class="bull">└</span>'+
      '<input type="text" class="sub-nm" placeholder="Sub-topic name" value="'+esc(s?s.label:'')+'">'+
      '<button type="button" class="icon-btn te-mini" data-delsub title="Remove sub-topic">'+I.x+'</button></div>';
  }
  function topicGroup(t){
    const subs=(t&&t.subtopics)||[];
    return '<div class="te-group" data-topic-id="'+esc(t?t.id:'')+'">'+
      '<div class="te-head">'+
        '<input type="text" class="emo" maxlength="3" placeholder="🙂" value="'+esc(t?(t.emoji||''):'')+'">'+
        '<input type="text" class="nm" placeholder="Topic name" value="'+esc(t?t.label:'')+'">'+
        '<div class="ord-btns"><button type="button" data-tup title="Move up">&#9650;</button><button type="button" data-tdown title="Move down">&#9660;</button></div>'+
        '<button type="button" class="icon-btn te-mini" data-deltopic title="Delete topic">'+I.trash+'</button>'+
      '</div>'+
      '<div class="te-subs">'+subs.map(subRow).join('')+
        '<button type="button" class="btn btn-sm btn-ghost" data-addsub style="align-self:flex-start">'+I.plus+' Sub-topic</button>'+
      '</div></div>';
  }
  const body=
    '<div class="mgr-note">Topics (and their sub-topics) build the left-hand tree for <b>'+esc(m?m.label:type)+'</b>. Renaming keeps existing content attached; deleting a topic only removes the topic — any items filed under it stay in your data and simply become unfiled. Emojis are optional.</div>'+
    '<div id="topicList">'+tops.map(topicGroup).join('')+'</div>'+
    '<button type="button" class="section-add" id="addTopicRow" style="display:flex">'+I.plus+' Add a topic</button>';
  openModal(modalShell('Manage topics','Tree · '+(m?m.label:cap(type)), body,
    '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="topicSave">'+I.check+' Save topics</button>'), {wide:true});

  const list=$('#topicList');
  list.addEventListener('click', e=>{
    const grp=e.target.closest('.te-group');
    if(e.target.closest('[data-addsub]') && grp){ grp.querySelector('.te-subs').insertBefore(domFrom(subRow(null)), e.target.closest('[data-addsub]')); }
    else if(e.target.closest('[data-delsub]')){ e.target.closest('.te-sub').remove(); }
    else if(e.target.closest('[data-deltopic]') && grp){ if(list.querySelectorAll('.te-group').length<=1){ toast('Keep at least one topic','err'); return; } grp.remove(); }
    else if(e.target.closest('[data-tup]') && grp && grp.previousElementSibling){ list.insertBefore(grp, grp.previousElementSibling); }
    else if(e.target.closest('[data-tdown]') && grp && grp.nextElementSibling){ list.insertBefore(grp.nextElementSibling, grp); }
  });
  $('#addTopicRow').addEventListener('click', ()=>{ list.insertAdjacentHTML('beforeend', topicGroup(null)); list.lastElementChild.scrollIntoView({behavior:'smooth',block:'nearest'}); });

  $('#topicSave').addEventListener('click', ()=>{
    const used={};
    const mkId=(existing,label)=>{
      if(existing){ used[existing]=1; return existing; }
      let base=prefix+'-'+(slug(label)||'topic'); let id=base, n=2;
      while(used[id] || findTopic(type,id)){ id=base+'-'+(n++); }
      used[id]=1; return id;
    };
    const groups=Array.from(list.querySelectorAll('.te-group'));
    let bad=false;
    const next=groups.map((grp,i)=>{
      const label=grp.querySelector('.nm').value.trim();
      if(!label) bad=true;
      const tid=mkId(grp.dataset.topicId||'', label);
      const subs=Array.from(grp.querySelectorAll('.te-sub')).map(sr=>{
        const slabel=sr.querySelector('.sub-nm').value.trim();
        if(!slabel) return null;
        let sid=sr.dataset.subId;
        if(!sid){ let base=tid+'-'+(slug(slabel)||'sub'); sid=base; let n=2; while(used[sid]){ sid=base+'-'+(n++); } }
        used[sid]=1;
        return { id:sid, label:slabel };
      }).filter(Boolean);
      return { id:tid, label:label||'Untitled', emoji:grp.querySelector('.emo').value.trim(), order:i, subtopics:subs };
    });
    if(bad) return toast('Every topic needs a name','err');
    DB.topics[type]=next; save(); closeModal(); toast('Topics updated','ok');
    if(!findTopic(type, current.topicId)){ const f=next[0]; current.topicId=f?f.id:null; current.subId=null; current.openId=null; expanded={}; if(f&&f.subtopics.length) expanded[f.id]=true; }
    else if(current.subId && !((findTopic(type,current.topicId).subtopics||[]).some(s=>s.id===current.subId))){ current.subId=null; }
    renderSidebar(); renderContent();
  });
}
function domFrom(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }

function downloadBlob(filename, text, mime){
  const blob=new Blob([text], {type:mime||'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
function exportData(){
  const stamp=new Date().toISOString().slice(0,10);
  const fname=(slug(DB.site.owner)||'knowledge-hub')+'-backup-'+stamp+'.json';
  downloadBlob(fname, JSON.stringify(DB, null, 2));
  toast('Data exported — keep this file safe','ok');
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let parsed;
    try{ parsed=JSON.parse(reader.result); }
    catch(e){ return toast('That file is not valid JSON','err'); }
    if(!parsed || !parsed.site || !Array.isArray(parsed.menus) || !parsed.topics){
      return toast('This does not look like a Knowledge Hub backup','err');
    }
    confirmReplace(()=>{
      DB=mergeDefaults(parsed); save();
      isAdmin=true; applyBranding(); applyMode(); renderNav();
      const first=enabledMenus()[0]; if(first) selectMenu(first.id); else { renderSidebar(); renderContent(); }
      closeModal(); toast('Site restored from backup','ok');
    });
  };
  reader.onerror=()=>toast('Could not read that file','err');
  reader.readAsText(file);
}
function confirmReplace(onYes){
  openModal(modalShell('Replace all content?','Import backup',
    '<p style="color:var(--ink-soft);line-height:1.6">Importing will <b>replace everything currently on the site</b> — menus, topics, questions, blogs, notes and your resume — with the contents of the backup file. Export your current data first if you might want it back.</p>',
    '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-danger" id="cfRep">'+I.upload+' Replace &amp; import</button>'));

    '<input type="file" id="ssImportFile" accept=".json,application/json" hidden>';
  openModal(modalShell('Site settings','Branding, security &amp; data', body,
    '<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ssSave">'+I.check+' Save settings</button>'), {wide:true});

  $('#ssExport').addEventListener('click', exportData);
  $('#ssImportBtn').addEventListener('click', ()=> $('#ssImportFile').click());
  $('#ssImportFile').addEventListener('change', e=>{ if(e.target.files[0]) importData(e.target.files[0]); });
  $('#ssSave').addEventListener('click', ()=>{
    const owner=$('#sOwner').value.trim()||'Knowledge Hub';
    const user=$('#sUser').value.trim(); const pass=$('#sPass').value;
    if(!user || !pass) return toast('User ID and password cannot be blank','err');
    DB.site=Object.assign({}, DB.site, {
      owner, brandInitial:($('#sInitial').value.trim()||owner.charAt(0).toUpperCase()),
      tagline:$('#sTagline').value.trim(), title:$('#sTitle').value.trim()||owner,
      adminUser:user, adminPass:pass
    });
    save(); applyBranding(); closeModal(); toast('Settings saved','ok');
  });
}

/* =====================================================================
   12. MOBILE DRAWERS + FLOATING ACTIONS
   ===================================================================== */
function syncBackdrop(){
  const nav=$('#nav'), side=$('#sidebar'), bd=$('#backdrop');
  const open=(nav&&nav.classList.contains('open'))||(side&&side.classList.contains('open'));
  if(bd) bd.classList.toggle('show', !!open);
}
function closeMobileNav(){ const n=$('#nav'); if(n) n.classList.remove('open'); syncBackdrop(); }
function closeMobileSidebar(){ const s=$('#sidebar'); if(s) s.classList.remove('open'); syncBackdrop(); }

function fabAction(){
  const t=current.type;
  if(t==='interview') onAdd('q');
  else if(t==='blogs') onAdd('blog');
  else if(t==='notes') onAdd('note');
  else if(t==='resume') resumeEditor();
}
function updateFabLabel(){
  const map={ interview:'Add question', blogs:'Write a post', notes:'New note', resume:'Edit resume' };
  const el=$('#fabLabel'); if(el) el.textContent=map[current.type]||'Add content';
}

/* floating "Topics" opener for the tree on small screens */
function setupMobileTopicsToggle(){
  const mq=window.matchMedia('(max-width:920px)');
  const side=$('#sidebar'), bd=$('#backdrop');
  const st=document.createElement('style');
  st.textContent='#topicsFab{position:fixed;left:16px;bottom:18px;z-index:60;display:none;align-items:center;gap:.45rem;padding:.72rem 1.05rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;font-size:.9rem;box-shadow:var(--shadow-lg);cursor:pointer;transition:transform .15s;}#topicsFab:hover{transform:translateY(-2px);}#topicsFab svg{width:17px;height:17px;color:var(--primary-strong);}';
  document.head.appendChild(st);
  const btn=document.createElement('button');
  btn.id='topicsFab'; btn.type='button';
  btn.innerHTML=I.layers+'<span>Browse topics</span>';
  btn.addEventListener('click', ()=>{ side.classList.add('open'); bd.classList.add('show'); });
  document.body.appendChild(btn);
  const refresh=()=>{ btn.style.display=(mq.matches && !side.hidden)?'inline-flex':'none'; };
  if(mq.addEventListener) mq.addEventListener('change', refresh); else mq.addListener(refresh);
  new MutationObserver(refresh).observe(side, {attributes:true, attributeFilter:['hidden']});
  return refresh;
}

/* =====================================================================
   13. INIT
   ===================================================================== */
let _inited=false;
function init(){
  if(_inited) return; _inited=true;
  load();
  applyBranding();
  applyMode();
  renderNav();
  const first=enabledMenus()[0];
  if(first) selectMenu(first.id); else { renderSidebar(); renderContent(); }

  const refreshTopicsFab=setupMobileTopicsToggle();

  /* keep the FAB label in step with the active section */
  const _selectMenu=selectMenu;
  selectMenu=function(id){ _selectMenu(id); updateFabLabel(); refreshTopicsFab(); closeMobileNav(); };
  updateFabLabel();

  /* header + chrome wiring */
  const navToggle=$('#navToggle');
  if(navToggle) navToggle.addEventListener('click', ()=>{ const n=$('#nav'); n.classList.toggle('open'); if(n.classList.contains('open')) $('#sidebar').classList.remove('open'); syncBackdrop(); });
  const bd=$('#backdrop');
  if(bd) bd.addEventListener('click', ()=>{ closeMobileNav(); closeMobileSidebar(); });
  const brand=$('#brandLink');
  if(brand) brand.addEventListener('click', e=>{ e.preventDefault(); const f=enabledMenus()[0]; if(f) selectMenu(f.id); window.scrollTo({top:0,behavior:'smooth'}); });
  const authBtn=$('#authBtn'); if(authBtn) authBtn.addEventListener('click', onAuthClick);
  const manageBtn=$('#manageBtn'); if(manageBtn) manageBtn.addEventListener('click', openSiteSettings);
  const fab=$('#fabAdd'); if(fab) fab.addEventListener('click', fabAction);

  /* close any open overlay when clicking the dim area outside the modal */
  const overlay=$('#overlay');
  if(overlay) overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeModal(); });
}

document.addEventListener('DOMContentLoaded', init);
if(document.readyState!=='loading') init();
</script>
